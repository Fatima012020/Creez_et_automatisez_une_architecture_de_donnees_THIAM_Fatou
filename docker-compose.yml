services:

  # -------------------------------------------------------
  # BASE DE DONNÉES POSTGRESQL
  # -------------------------------------------------------
  # PostgreSQL stockera les données du POC :
  # salariés, profils sportifs, activités et résultats
  # de validation des trajets.
  postgres:
    image: postgres:16

    container_name: sport_data_postgres

    # Redémarre automatiquement le conteneur
    # sauf s'il a été arrêté volontairement.
    restart: unless-stopped

    # Les informations de connexion sont récupérées
    # depuis le fichier .env.
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    # Le port PostgreSQL du conteneur est rendu
    # accessible depuis notre ordinateur.
    ports:
      - "5433:5432"

    # Ce volume permet de conserver les données même
    # lorsque le conteneur PostgreSQL est arrêté.
    volumes:
      - postgres_data:/var/lib/postgresql/data

     # Active la réplication logique PostgreSQL.
    # Debezium pourra ensuite exploiter le WAL
    # pour détecter les changements des tables surveillées.
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"

    # Vérification automatique de l'état de PostgreSQL.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda:
    # Redpanda est compatible avec le protocole Kafka.
    # Il servira de plateforme de streaming pour transporter
    # les événements produits plus tard par Debezium.
    image: redpandadata/redpanda:latest
    container_name: sport_data_redpanda

    command:
      - redpanda
      - start

      # Mode adapté à notre POC local :
      # un seul nœud Redpanda.
      - --smp
      - "1"

      # Limite la mémoire utilisée par le conteneur.
      - --memory
      - "1G"

      # Désactive la réservation mémoire spécifique
      # aux environnements de production.
      - --overprovisioned

      # Deux interfaces Kafka sont exposées :
      #
      # INTERNAL : communication entre les conteneurs Docker.
      # EXTERNAL : communication depuis Windows.
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092

      # Adresses annoncées aux clients Kafka.
      #
      # Debezium, situé dans Docker, utilise redpanda:9092.
      # Python, exécuté sur Windows, utilise localhost:19092.
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092

    ports:
      # Port Kafka interne, déjà utilisé dans notre architecture.
      - "9092:9092"

      # Port Kafka externe destiné aux programmes
      # exécutés directement sur Windows.
      - "19092:19092"

    volumes:
      # Les événements restent persistants même si
      # le conteneur est redémarré.
      - redpanda_data:/var/lib/redpanda/data

  debezium:
    # Kafka Connect avec les connecteurs Debezium intégrés.
    # Il servira ensuite à capturer les changements
    # PostgreSQL et à les publier dans Redpanda.
    image: quay.io/debezium/connect:3.3
    container_name: sport_data_debezium

    # Debezium doit démarrer après Redpanda.
    # Cela ne remplace pas les contrôles de disponibilité,
    # mais évite de lancer les services dans le mauvais ordre.
    depends_on:
      - redpanda

    environment:
      # Adresse Kafka vue depuis le réseau Docker.
      # On utilise donc redpanda:9092 et non localhost:9092.
      BOOTSTRAP_SERVERS: redpanda:9092

      # Identifiant du groupe Kafka Connect.
      GROUP_ID: sport-data-connect

      # Topics techniques utilisés par Kafka Connect
      # pour conserver sa configuration, ses offsets
      # et l'état des connecteurs.
      CONFIG_STORAGE_TOPIC: sport-data-connect-configs
      OFFSET_STORAGE_TOPIC: sport-data-connect-offsets
      STATUS_STORAGE_TOPIC: sport-data-connect-status

      # Notre POC ne possède qu'un seul broker Redpanda.
      # On utilise donc un facteur de réplication de 1.
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1

    ports:
      # API REST Kafka Connect.
      # Nous l'utiliserons pour créer et contrôler
      # le connecteur PostgreSQL.
      - "8083:8083"

  consumer:
    # -------------------------------------------------------
    # CONSUMER PYTHON - NOTIFICATIONS SLACK
    # -------------------------------------------------------
    # Ce service écoute automatiquement les nouvelles
    # activités publiées par Debezium dans Redpanda.
    #
    # Il enrichit chaque activité avec les informations
    # du salarié stockées dans PostgreSQL puis envoie
    # automatiquement une notification Slack.

    build:
      context: .
      dockerfile: Dockerfile.consumer

    container_name: sport_data_consumer

    # Le consumer redémarre automatiquement en cas
    # d'arrêt inattendu du processus.
    restart: unless-stopped

    environment:
      # PostgreSQL accessible depuis le réseau Docker.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      # Redpanda accessible depuis le réseau Docker.
      REDPANDA_BOOTSTRAP_SERVERS: redpanda:9092
      REDPANDA_TOPIC: sport-data.public.activities
      REDPANDA_GROUP_ID: sport-data-slack-consumer

      # Secret Slack provenant du fichier .env.
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}

    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started

  spark:
    # -------------------------------------------------------
    # SPARK STRUCTURED STREAMING
    # -------------------------------------------------------
    # Ce service consomme automatiquement les événements
    # Redpanda et les écrit dans Delta Lake.
    #
    # Il fonctionne en continu et utilise un checkpoint
    # persistant pour reprendre après une interruption.

    build:
      context: .
      dockerfile: Dockerfile.spark

    container_name: sport_data_spark

    restart: unless-stopped

    depends_on:
      redpanda:
        condition: service_started

    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./spark:/opt/spark/work-dir/scripts
      - ./data/delta:/opt/spark/work-dir/delta
      - ./data/checkpoints:/opt/spark/work-dir/checkpoints
      - ./data/powerbi:/opt/spark/work-dir/powerbi

    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,io.delta:delta-spark_2.12:3.2.0
      - --conf
      - spark.jars.ivy=/opt/spark/.ivy2
      - /opt/spark/work-dir/scripts/04_stream_to_delta.py

  benefits-worker:
    # -------------------------------------------------------
    # AUTOMATISATION DES CALCULS MÉTIER ET DE POWER BI
    # -------------------------------------------------------
    # Surveille Delta activities.
    #
    # Lorsqu'une nouvelle transaction Delta est détectée :
    # 1. employee_benefits est recalculé ;
    # 2. les contrôles qualité sont exécutés ;
    # 3. les CSV Power BI sont régénérés.
    #
    # En cas d'erreur, le worker reste actif et réessaie.

    build:
      context: .
      dockerfile: Dockerfile.spark

    container_name: sport_data_benefits_worker

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      spark:
        condition: service_started

    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      # Webhook utilisé pour envoyer les alertes techniques
      # en cas d'échec ou de reprise du pipeline métier.
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}

    volumes:
      - ./spark:/opt/spark/work-dir/scripts
      - ./data/delta:/opt/spark/work-dir/delta
      - ./data/checkpoints:/opt/spark/work-dir/checkpoints
      - ./data/powerbi:/opt/spark/work-dir/powerbi

    command:
      - python3
      - -u
      - /opt/spark/work-dir/scripts/15_auto_benefits_worker.py
      
# ---------------------------------------------------------
# VOLUMES DOCKER
# ---------------------------------------------------------

volumes:

  # Réutilisation du volume PostgreSQL historique du projet V2.
  # Ce volume contient les données métier déjà générées :
  # employés, profils sportifs, activités et validations trajets.
  postgres_data:
    external: true
    name: crez_et_automatisez_une_architecture_de_donnees_v2_postgres_data

  redpanda_data: